name: Compilar ejecutables

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name: ComprobadorContrasenas-windows.exe
          - os: macos-latest
            asset_name: ComprobadorContrasenas-mac.zip
          - os: ubuntu-latest
            asset_name: ComprobadorContrasenas-linux.zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar tkinter (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Instalar PyInstaller
        run: pip install pyinstaller

      - name: Compilar (Windows)
        if: matrix.os == 'windows-latest'
        run: pyinstaller --onefile --windowed --name ComprobadorContrasenas password_checker.py

      - name: Renombrar ejecutable (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: cp dist/ComprobadorContrasenas.exe dist/${{ matrix.asset_name }}

      - name: Compilar (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          pyinstaller --onefile --windowed --name ComprobadorContrasenas password_checker.py
          chmod +x dist/ComprobadorContrasenas
          cd dist && zip -r ${{ matrix.asset_name }} ComprobadorContrasenas

      - name: Compilar (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          pyinstaller --windowed --name ComprobadorContrasenas password_checker.py
          cd dist && ditto -c -k --sequesterRsrc --keepParent ComprobadorContrasenas.app ${{ matrix.asset_name }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

      - name: Adjuntar a la release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.asset_name }}
